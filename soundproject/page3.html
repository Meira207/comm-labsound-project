    <p class="begin-sub">Only seconds away from relief... It'll all be over soon</p>
    <button id="beginButton" type="button">Finish Exam</button>

  <!-- Main exam scene -->
  <main class="stage" id="stage">

    <!-- First classroom background -->
    <img id="classroomBackground" class="room-image" src="media/classroom1.png" alt="Student finishing an exam">

    <img id="teacher" src="media/teacher.png" alt="Teacher waiting to collect the exam">

    <!-- Clickable area for finishing the exam -->
    <button id="examHotspot" type="button" aria-label="Click to finish writing the exam"></button>

  </main>

  <!-- Story captions -->
  <p id="caption" class="caption" aria-live="polite"></p>
